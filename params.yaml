# Parametros del proyecto, versionados junto con el codigo.
# La idea (clase 4) es que un hiperparametro no quede escondido adentro de un
# script: si cambia el resultado, tiene que estar declarado en algun lado.

split:
  test_size: 0.20
  random_state: 42
  stratify: true

preprocessing:
  numeric_imputer: median
  categorical_imputer: most_frequent
  scaler: standard
  encoder: onehot
  handle_unknown: ignore

models:
  baseline:
    strategy: most_frequent
  logistic:
    max_iter: 1000
    random_state: 42
  forest:
    n_estimators: 300
    max_depth: 8
    random_state: 42

seleccion:
  metrica: roc_auc

riesgo:
  low_max: 0.35
  medium_max: 0.65
  decision_threshold: 0.50
